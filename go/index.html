<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Golden Grid Solutions</title>
<link rel="canonical" href="https://goldengsolutions.com/">
<style>body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:60px 24px;text-align:center;color:#1c1b19;background:#fbfaf8}a{color:#b45309}</style>
</head>
<body>
<p>Taking you to Golden Grid Solutions&hellip;</p>
<p><a id="fallback" href="/cold-storage.html">Continue</a></p>
<script>
(function () {
  var PAGES = ["about","book","clfp","cold-storage","commercial","data-centers","faq",
    "food-production","food-retail","food-service","guarantee","healthcare",
    "heavy-industry","hotels","index","pubs-bars-restaurants"];
  var DEFAULT_PAGE = "cold-storage";
  var DEFAULT_CAMPAIGN = "cold_storage_aug2026";

  var q = new URLSearchParams(window.location.search);
  var code = (q.get("c") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 32);
  var page = (q.get("p") || "").replace(/[^a-z0-9-]/g, "").slice(0, 48);
  var camp = (q.get("k") || "").replace(/[^a-z0-9_]/g, "").slice(0, 64);

  if (PAGES.indexOf(page) === -1) page = DEFAULT_PAGE;
  if (!camp) camp = DEFAULT_CAMPAIGN;

  var url = "/" + page + ".html"
          + "?utm_source=email&utm_medium=email"
          + "&utm_campaign=" + encodeURIComponent(camp)
          + (code ? "&utm_content=" + encodeURIComponent(code) : "");

  var a = document.getElementById("fallback");
  if (a) a.setAttribute("href", url);
  window.location.replace(url);
})();
</script>
</body>
</html>
